[project]
name = "finintel"
version = "0.1.0"
description = "Private personal finance & investment intelligence system with a Claude MCP server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "keyring>=25.0",
    "cryptography>=42.0",
    "plaid-python>=20.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "snaptrade-python-sdk>=12.0",
    "pypdf>=4.0",
    "mcp>=2,<3",
]

[project.scripts]
fin = "fin.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.5", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fin", "fin_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Harmless notice from Starlette's test client about its HTTP library; not our code.
    "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.ruff]
line-length = 100
